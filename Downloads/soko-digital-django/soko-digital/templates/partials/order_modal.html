<div class="modal fade" id="order-modal" tabindex="-1" aria-labelledby="order-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="order-title">Order</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="order-summary" class="mb-3"></p>
        <form id="order-form" novalidate>
          <div class="row g-3">
            <div class="col-5">
              <label for="o-qty" class="form-label">Quantity (kg)</label>
              <input id="o-qty" type="number" min="1" class="form-control" required>
            </div>
            <div class="col-7">
              <label for="o-phone" class="form-label">M-Pesa number</label>
              <input id="o-phone" type="tel" class="form-control" placeholder="0712345678" required>
            </div>
            <div class="col-12"><div class="invalid-msg text-danger small" id="o-error" role="alert"></div></div>
          </div>
          <dl class="row mt-2 mb-3 small">
            <dt class="col-6">Produce</dt><dd class="col-6 text-end" id="t-produce">KES 0</dd>
            <dt class="col-6">Delivery to Nairobi</dt><dd class="col-6 text-end" id="t-delivery">KES 0</dd>
            <dt class="col-6 fs-6">You pay</dt><dd class="col-6 text-end fs-6 fw-bold" id="t-total">KES 0</dd>
          </dl>
          <button class="btn btn-primary w-100" type="submit" id="o-pay">Pay with M-Pesa</button>
        </form>
        <ul class="list-group list-group-flush mt-3 d-none" id="timeline">
          <li class="list-group-item" data-step="order">Order created</li>
          <li class="list-group-item" data-step="paid">Payment received and held</li>
          <li class="list-group-item" data-step="delivered">Delivered to you</li>
          <li class="list-group-item" data-step="released">Farmer paid</li>
        </ul>
        <div class="d-none mt-3" id="confirm-box">
          <p class="mb-2 fw-semibold">Is the order as described?</p>
          <button class="btn btn-primary me-2" type="button" id="o-confirm">Confirm delivery</button>
          <button class="btn btn-outline-danger" type="button" id="o-report">Report a problem</button>
        </div>
        <div class="alert mt-3 d-none" id="o-result" role="status"></div>
      </div>
    </div>
  </div>
</div>
