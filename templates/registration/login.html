{% extends "base.html" %}
{% load market_extras %}
{% block title %}Log in – Soko Digital{% endblock %}
{% block content %}
<main id="main" class="container py-5 auth-card">
  <span class="logo-mark">{% icon "sprout" %}</span>
  <h1 class="h2 mb-4">Log in</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0">New here? <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
</main>
{% endblock %}
{% block scripts %}{% endblock %}
