{% extends "base.html" %}
{% block title %}Register – Soko Digital{% endblock %}
{% block content %}
<main class="container py-5 auth-card">
  <h1 class="h2 mb-2">Create your account</h1>
  <p class="mb-4">Farmers list produce. Buyers order it.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "partials/form_fields.html" %}
    <button class="btn btn-primary w-100" type="submit">Register</button>
  </form>
  <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</main>
{% endblock %}
{% block scripts %}{% endblock %}
